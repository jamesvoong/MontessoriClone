backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

site_url: https://monkeytreemontessori.netlify.app

collections:
  - name: "pages"
    label: "Pages"
    files:

      - name: "home"
        label: "Home Page"
        file: "src/data/home.json"
        fields:
          - { label: "Hero Tagline", name: "hero_tagline", widget: "string" }
          - { label: "Intro Title", name: "intro_title", widget: "string" }
          - { label: "Intro Text", name: "intro_text", widget: "text" }

      - name: "curriculum"
        label: "Curriculum Page"
        file: "src/data/curriculum.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Intro Paragraph", name: "intro", widget: "text" }

      - name: "maria"
        label: "About Maria Montessori"
        file: "src/data/maria.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - label: "Bio Paragraphs"
            name: "paragraphs"
            widget: "list"
            field:
              label: "Paragraph"
              name: "text"
              widget: "text"

      - name: "registration"
        label: "Registration Page"
        file: "src/data/registration.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Who Can Enroll Text", name: "who_can_enroll", widget: "text" }
          - { label: "How to Register Text", name: "how_to_register", widget: "text" }
          - { label: "Morning Class Price", name: "morning_price", widget: "string" }
          - { label: "Afternoon Class Price", name: "afternoon_price", widget: "string" }
          - { label: "Registration Fee", name: "registration_fee", widget: "string" }
          - { label: "Subsidy Text", name: "subsidy_text", widget: "text" }

      - name: "contact"
        label: "Contact Page"
        file: "src/data/contact.json"
        fields:
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram Handle", name: "instagram_handle", widget: "string" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
          - { label: "Office Hours", name: "office_hours", widget: "string" }
